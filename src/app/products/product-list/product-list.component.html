<mat-card>
  <mat-card-header>
    <mat-card-title>Products</mat-card-title>
    <span class="spacer"></span>
    <button mat-raised-button color="primary" routerLink="/products/add">
      <mat-icon>add</mat-icon> Add Product
    </button>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="products" class="mat-elevation-z8">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let product">{{ product.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let product">{{ product.name }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Price</th>
        <td mat-cell *matCellDef="let product">{{ product.price | currency }}</td>
      </ng-container>

      <ng-container matColumnDef="vendorId">
        <th mat-header-cell *matHeaderCellDef>Vendor ID</th>
        <td mat-cell *matCellDef="let product">{{ product.vendorId }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let product">
          <button mat-icon-button color="primary" [routerLink]="['/orders/create']" [queryParams]="{productId: product.id}">
            <mat-icon>shopping_cart</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
